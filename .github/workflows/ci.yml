name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Android SDK (API 21)
        id: cache-android-sdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/android-sdk
          key: ${{ runner.os }}-android-sdk-21-25.0.0-v1

      - name: Install SDK platform 21 & build-tools 25.0.0
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="${{ runner.temp }}/android-sdk" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="${{ runner.temp }}/android-sdk" "platforms;android-21" "build-tools;25.0.0"

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache-jdk: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        run: |
          printf 'BASE_URL="%s"\nFILE_BASE_URL="%s"\nAUTH_BASE_URL="%s"\nNEOMETRICS_BASE_URL="%s"\n' \
            "${{ secrets.BASE_URL }}" "${{ secrets.FILE_BASE_URL }}" \
            "${{ secrets.AUTH_BASE_URL }}" "${{ secrets.NEOMETRICS_BASE_URL }}" > local.properties

      - name: Build debug APK and run unit tests
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: ./gradlew test assembleDebug --no-daemon --stacktrace

      - name: Find built APK
        id: find-apk
        run: |
          APK=$(find app/build/outputs/apk -maxdepth 2 -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          test -n "$APK"
          echo "apk-path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: holomarket-debug
          path: ${{ steps.find-apk.outputs.apk-path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
