name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Android SDK (API 21)
        id: cache-android-sdk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/android-sdk
          key: ${{ runner.os }}-android-sdk-21-25.0.0-v1

      - name: Install SDK platform 21 & build-tools 25.0.0
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="${{ runner.temp }}/android-sdk" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="${{ runner.temp }}/android-sdk" "platforms;android-21" "build-tools;25.0.0"

      - name: Set up JDK 8 (for Gradle build)
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache-jdk: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version and artifact name
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PRERELEASE=false
          SUFFIX="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" = "$VERSION" ]; then
              echo "Tag v$TAG matches versionName $VERSION."
            elif [ "${TAG#"$VERSION".}" != "$TAG" ]; then
              echo "Tag v$TAG is a test build for versionName $VERSION."
              PRERELEASE=true
            else
              echo "Tag v$TAG does not match versionName $VERSION." >&2
              exit 1
            fi
            SUFFIX="$GITHUB_REF_NAME"
          fi

          echo "apk-name=HoloMarket-$SUFFIX.apk" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        run: |
          printf 'BASE_URL="%s"\nFILE_BASE_URL="%s"\nAUTH_BASE_URL="%s"\nNEOMETRICS_BASE_URL="%s"\n' \
            "${{ secrets.BASE_URL }}" "${{ secrets.FILE_BASE_URL }}" \
            "${{ secrets.AUTH_BASE_URL }}" "${{ secrets.NEOMETRICS_BASE_URL }}" > local.properties

      - name: Build release APK and run unit tests
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          for attempt in 1 2 3; do
            if ./gradlew test assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Build attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          exit 1

      - name: Verify APK is signed
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          APK=app/build/outputs/apk/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/25.0.0/apksigner" verify --print-certs "$APK"

      - name: Copy APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/app-release.apk "dist/${{ steps.version.outputs.apk-name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.apk-name }}
          path: dist/${{ steps.version.outputs.apk-name }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ steps.version.outputs.apk-name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
